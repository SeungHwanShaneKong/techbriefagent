version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tech_news_backend
    ports:
      - "8000:8000"
    volumes:
      - ./tech_news.db:/app/tech_news.db
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - tech_news_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=http://backend:8000
    container_name: tech_news_frontend
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - tech_news_net

networks:
  tech_news_net:
    driver: bridge
