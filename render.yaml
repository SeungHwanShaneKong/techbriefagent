# ============================================================
#  Render.com Blueprint - Tech News Intelligence Hub (Full-Stack)
# ============================================================
#  단일 서비스로 FastAPI 백엔드 + React 프론트엔드 함께 서빙
#  배포: Render Dashboard → New → Blueprint → 이 레포 연결
#  https://render.com/docs/blueprint-spec
# ============================================================

services:
  - type: web
    name: tech-news-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/crawl-status
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_INPUT_COST_PER_1M
        value: "0.15"
      - key: OPENAI_OUTPUT_COST_PER_1M
        value: "0.60"
      - key: OPENAI_SSL_VERIFY
        value: "true"
      - key: DB_URL
        value: sqlite:////app/data/tech_news.db
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: INFO
      - key: USD_TO_KRW_RATE
        value: "1350.0"
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: tech-news-data
      mountPath: /app/data
      sizeGB: 1
